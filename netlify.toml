# BPV-1 firmware simulator — Netlify configuration
#
# There is no build step. The site is a single static HTML file plus its
# documentation, published straight from the repository root.

[build]
  publish = "."
  command = ""

# The simulator makes no network requests of any kind. This policy enforces
# that at the browser level: nothing may be loaded from, or sent to, anywhere.
# Inline script and style are permitted because the entire application is one
# self-contained file by design.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), bluetooth=(), serial=(), hid=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The simulator itself is edited between demos; never let a stale copy stick.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/preview.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
